name: Collect market data

# The always-on tracker: snapshots the watchlist.json items every 3 hours on
# GitHub's servers and commits the data files the dashboard reads — so the
# Pages link keeps accruing history with nobody's laptop involved.
# "Run workflow" (workflow_dispatch) = the dashboard's "snapshot now".
#
# Cadence: every 3 hours (was 6) — more prints per day thickens each fixing
# window and tightens the PERPMARK-CASE preview; HOURLY is the M5 end-state
# once per-run API budgets (skinport 8-item rotation, book 10-item rotation)
# are re-sized for it. The CN/US gauge windows (10-15 / 22-03 UTC) still get
# their regional peaks: :17 samples at 12/15 UTC (Beijing evening) and
# 00/03 UTC (US evening) land inside both windows.

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Sampling jitter (INTEG-1): the cron instants are public, and a fixed
      # sampling instant is gameable — a manipulator only has to hold a fake
      # price AT the reading moments, not all day. 0-10 min of random delay
      # (on top of GitHub's own 0-15 min scheduling noise) makes the actual
      # reading time unpredictable. Manual runs skip the wait; the CN/US
      # gauge windows (10-15 / 22-03 UTC) tolerate the shift from :17.
      - name: Sampling jitter
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 600))
      - name: Snapshot watchlist
        run: node collect.js
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no data changes"; else
            git commit -m "data: market snapshot $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin main
            git push origin main
          fi
      # GITHUB_TOKEN pushes do NOT trigger other workflows (recursion guard),
      # so pages.yml never sees the data commit — the collector must deploy
      # its own data to the Pages branch.
      - name: Deploy to Pages (mirror → gh-pages)
        run: git push --force origin HEAD:gh-pages
