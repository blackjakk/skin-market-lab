name: Gates

# Both probes on every push. Hermetic — the fixture transport means no real
# Steam/Skinport traffic ever leaves CI.
#   probe.js        — analytics math pinned to hand-computed values + full API flow
#   client-probe.js — real Chromium drives the dashboard (chart pixels painted,
#                     crosshair tooltip, portfolio form, static-host discovery)

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore:
      - "data/**"     # collector commits are data-only — no code to gate
      - "backtest/**" # backtest artifacts (fetched history + result) — data, not code
  pull_request:
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_LIB: playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser toolchain (client probe only)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Tracker probe (analytics math + API + collector, 133 checks)
        run: node probe.js
      - name: Dashboard probe (real Chromium, live + static modes, 39 checks)
        run: node client-probe.js
      - name: A11y probe (real Chromium — keyboard, focus, contrast, responsive, semantics)
        run: node tools/a11y-probe.js
      - name: Design System guard (no-bypass ratchet)
        run: node tools/ds-guard.js
      - name: Design System component test (real Chromium)
        run: node tools/ds-component-test.js

  # On-chain settlement layer (contracts/ + test/ — SkindexSettlement +
  # WitnessOracle). Toolchain is devDependencies only; the runtime app stays
  # zero-dependency, so this job is the only place npm ci runs.
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install contract toolchain (devDependencies only)
        run: npm ci
      - name: Hardhat suite (SkindexSettlement + WitnessOracle, 58 tests)
        run: npx hardhat test
