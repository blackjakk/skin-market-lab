name: Deploy to GitHub Pages

# Publishes the dashboard on every push to main by mirroring main onto the
# gh-pages branch, which GitHub Pages serves (auto-provisioned when the
# branch first appeared — the actions-based deploy path can't CREATE the
# Pages site with a workflow token, so this repo uses branch deploys).
# No build step: the site is the repo root as-is. The static page discovers
# a tracker running on the visitor's machine (localhost:8790) for live data.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Mirror main → gh-pages
        run: git push --force origin HEAD:gh-pages
